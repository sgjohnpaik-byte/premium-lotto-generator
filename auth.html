<script>
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);
    var b=document.getElementById("themeToggle"); if(b) b.textContent=t==="light"?"☀️":"🌙";
    try{localStorage.setItem("lotto_theme",t);}catch(e){}}
document.addEventListener("click",function(e){
    if(e.target&&e.target.id==="themeToggle"){
        var cur=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";applyTheme(cur);}});
(function(){var t="dark";try{t=localStorage.getItem("lotto_theme")||"dark";}catch(e){}applyTheme(t);})();
</script>

<!-- ===== Supabase 인증 ===== -->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://qebfpipnxwojwgoqjxmo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_l3ZYR4EBNvbDdf49TkmwXA_LqBT-cFh";

const statusEl = document.getElementById("authStatus");
const authView = document.getElementById("authView");
const userView = document.getElementById("userView");
const form = document.getElementById("authForm");
const emailEl = document.getElementById("email");
const passEl = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const tabLogin = document.getElementById("tabLogin");
const tabSignup = document.getElementById("tabSignup");
const userEmail = document.getElementById("userEmail");
const logoutBtn = document.getElementById("logoutBtn");

let mode = "login";

function setMode(m){
    mode = m;
    const login = m === "login";
    tabLogin.classList.toggle("active", login);
    tabSignup.classList.toggle("active", !login);
    submitBtn.textContent = login ? "로그인" : "회원가입";
    passEl.setAttribute("autocomplete", login ? "current-password" : "new-password");
    statusEl.className = "auth-status"; statusEl.textContent = "";
}
tabLogin.addEventListener("click", () => setMode("login"));
tabSignup.addEventListener("click", () => setMode("signup"));

if (SUPABASE_URL === "YOUR_SUPABASE_URL") {
    statusEl.className = "auth-status err";
    statusEl.textContent = "⚠️ 로그인 기능을 사용하려면 Supabase 설정이 필요합니다.";
    submitBtn.disabled = true;
} else {
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function render(session){
        if (session && session.user){
            authView.style.display = "none";
            userView.style.display = "block";
            userEmail.textContent = session.user.email;
        } else {
            authView.style.display = "block";
            userView.style.display = "none";
        }
    }

    supabase.auth.getSession().then(({ data }) => render(data.session));
    supabase.auth.onAuthStateChange((_event, session) => render(session));

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = emailEl.value.trim();
        const password = passEl.value;
        statusEl.className = "auth-status"; statusEl.textContent = "";
        submitBtn.disabled = true;
        submitBtn.textContent = mode === "login" ? "로그인 중..." : "가입 중...";
        try {
            if (mode === "login") {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                statusEl.className = "auth-status ok";
                statusEl.textContent = "✅ 로그인되었습니다.";
            } else {
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) throw error;
                statusEl.className = "auth-status ok";
                statusEl.textContent = "✅ 가입 완료! 확인 이메일을 보냈습니다. 메일의 링크를 눌러 인증해 주세요.";
            }
        } catch (err) {
            statusEl.className = "auth-status err";
            statusEl.textContent = "❌ " + (err.message || "오류가 발생했습니다.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = mode === "login" ? "로그인" : "회원가입";
        }
    });

    logoutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        statusEl.className = "auth-status";
        statusEl.textContent = "로그아웃되었습니다.";
    });
}
</script>
