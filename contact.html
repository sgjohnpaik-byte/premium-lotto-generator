<style>
:root{
    --bg1:#1e3c72; --bg2:#2a5298; --bg3:#6dd5ed;
    --panel:rgba(255,255,255,0.14);
    --panel-strong:rgba(255,255,255,0.22);
    --text:#ffffff;
    --muted:rgba(255,255,255,0.78);
    --accent1:#ff9800; --accent2:#ff5722;
    --border:rgba(255,255,255,0.25);
    --shadow:0 10px 30px rgba(0,0,0,.3);
    --ok:#81c784; --err:#ff8a80;
}
html[data-theme="light"]{
    --bg1:#f7f9fc; --bg2:#ffffff; --bg3:#eef2f8;
    --panel:rgba(255,255,255,0.92);
    --panel-strong:#ffffff;
    --text:#1c2533;
    --muted:#5b6678;
    --accent1:#ff9800; --accent2:#ff5722;
    --border:rgba(20,30,50,0.10);
    --shadow:0 8px 26px rgba(30,50,90,.12);
    --ok:#2e7d32; --err:#c62828;
}

*{margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI","Malgun Gothic",sans-serif;}

body{
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:400% 400%;
    animation:bgMove 12s infinite alternate;
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    padding:24px 12px; color:var(--text);
}
@keyframes bgMove{0%{background-position:left;}100%{background-position:right;}}
@media (prefers-reduced-motion: reduce){body{animation:none;}}

.container{
    width:100%; max-width:560px;
    padding:32px 28px 28px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:25px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    box-shadow:var(--shadow);
}

.top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.back-link{color:var(--muted); text-decoration:none; font-size:14px;}
.back-link:hover{color:var(--text);}
.icon-btn{
    background:var(--panel-strong); border:1px solid var(--border);
    color:var(--text); width:42px; height:42px; border-radius:50%;
    font-size:18px; cursor:pointer; transition:.2s;
    display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover{transform:scale(1.08);}

h1{font-size:clamp(26px,5vw,34px); margin-bottom:6px; text-align:center;}
.subtitle{color:var(--muted); text-align:center; margin-bottom:26px; font-size:14px;}

form{display:flex; flex-direction:column; gap:16px;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:14px; font-weight:600;}
.field label .req{color:var(--accent1);}
.field input, .field select, .field textarea{
    padding:12px 14px; border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel-strong); color:var(--text);
    font-size:15px; outline:none; width:100%;
    transition:border-color .2s;
}
.field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--accent1);
}
.field textarea{resize:vertical; min-height:120px;}
.field input::placeholder, .field textarea::placeholder{color:var(--muted);}

.hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}

button[type="submit"]{
    margin-top:6px; padding:15px; font-size:18px; border:none; border-radius:50px;
    cursor:pointer; color:white; font-weight:bold;
    background:linear-gradient(45deg,var(--accent1),var(--accent2));
    transition:.3s;
}
button[type="submit"]:hover{transform:scale(1.02); box-shadow:0 0 20px rgba(255,152,0,.6);}
button[type="submit"]:disabled{opacity:.6; cursor:not-allowed; transform:none; box-shadow:none;}

.status{margin-top:14px; text-align:center; font-size:15px; font-weight:600; min-height:22px;}
.status.ok{color:var(--ok);}
.status.err{color:var(--err);}

.privacy{margin-top:18px; font-size:12px; color:var(--muted); text-align:center; line-height:1.6;}
</style>
</head>

<body>
<div class="container">
    <div class="top-bar">
        <a class="back-link" href="index.html">← 로또 생성기로</a>
        <button class="icon-btn" id="themeToggle" title="테마 변경" aria-label="테마 변경">🌙</button>
    </div>

    <h1>🤝 제휴 문의</h1>
    <p class="subtitle">광고·제휴·협업 제안을 남겨주세요. 빠르게 회신드리겠습니다.</p>

    <form id="contactForm" action="https://formspree.io/f/maqgeyll" method="POST">

        <div class="field">
            <label for="name">이름 / 회사명 <span class="req">*</span></label>
            <input id="name" name="name" type="text" required placeholder="홍길동 / (주)예시컴퍼니">
        </div>

        <div class="field">
            <label for="email">이메일 <span class="req">*</span></label>
            <input id="email" name="email" type="email" required placeholder="you@example.com">
        </div>

        <div class="field">
            <label for="phone">연락처 (선택)</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="010-0000-0000">
        </div>

        <div class="field">
            <label for="type">문의 유형 <span class="req">*</span></label>
            <select id="type" name="type" required>
                <option value="" disabled selected>선택하세요</option>
                <option value="광고 문의">광고 문의</option>
                <option value="제휴 제안">제휴 제안</option>
                <option value="기능 협업">기능 협업</option>
                <option value="기타">기타</option>
            </select>
        </div>

        <div class="field">
            <label for="message">문의 내용 <span class="req">*</span></label>
            <textarea id="message" name="message" required placeholder="제안 내용을 자유롭게 작성해주세요."></textarea>
        </div>

        <!-- 스팸 방지 honeypot (사람에게는 안 보임) -->
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
        <!-- 메일 제목 -->
        <input type="hidden" name="_subject" value="[제휴문의] Premium Lotto Generator">

        <button type="submit" id="submitBtn">문의 보내기</button>
    </form>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <p class="privacy">제출하신 정보는 문의 회신 목적으로만 사용되며 제3자에게 제공되지 않습니다.<br>
    <a href="index.html" style="color:var(--muted);">홈</a> ·
    <a href="guide.html" style="color:var(--muted);">가이드</a> ·
    <a href="faq.html" style="color:var(--muted);">FAQ</a> ·
    <a href="about.html" style="color:var(--muted);">소개</a> ·
    <a href="privacy.html" style="color:var(--muted);">개인정보처리방침</a> ·
    <a href="terms.html" style="color:var(--muted);">이용약관</a></p>
</div>

<script>
"use strict";

/* 테마 (로또 페이지와 동일 키 공유) */
function applyTheme(t){
    document.documentElement.setAttribute("data-theme",t);
    document.getElementById("themeToggle").textContent = t==="light" ? "☀️" : "🌙";
    try{ localStorage.setItem("lotto_theme",t); }catch(e){}
}
document.getElementById("themeToggle").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
    applyTheme(cur);
};
(function(){
    let t="dark";
    try{ t=localStorage.getItem("lotto_theme")||"dark"; }catch(e){}
    applyTheme(t);
})();

/* AJAX 제출 → 페이지 이동 없이 결과 표시 */
const form=document.getElementById("contactForm");
const statusEl=document.getElementById("status");
const submitBtn=document.getElementById("submitBtn");

form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    statusEl.className="status";
    statusEl.textContent="";

    if(form.action.includes("YOUR_FORM_ID")){
        statusEl.className="status err";
        statusEl.textContent="⚠️ Formspree 폼 ID가 아직 설정되지 않았습니다.";
        return;
    }

    submitBtn.disabled=true;
    submitBtn.textContent="보내는 중...";

    try{
        const res=await fetch(form.action,{
            method:"POST",
            body:new FormData(form),
            headers:{ "Accept":"application/json" }
        });
        if(res.ok){
            form.reset();
            statusEl.className="status ok";
            statusEl.textContent="✅ 문의가 정상적으로 접수되었습니다. 감사합니다!";
        }else{
            const data=await res.json().catch(()=>({}));
            const msg=(data.errors&&data.errors.map(x=>x.message).join(", "))||"전송에 실패했습니다.";
            statusEl.className="status err";
            statusEl.textContent="❌ "+msg;
        }
    }catch(err){
        statusEl.className="status err";
        statusEl.textContent="❌ 네트워크 오류로 전송하지 못했습니다. 잠시 후 다시 시도해주세요.";
    }finally{
        submitBtn.disabled=false;
        submitBtn.textContent="문의 보내기";
    }
});
</script>
</body>
